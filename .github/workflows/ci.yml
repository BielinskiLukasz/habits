# Source: D-38 + D-24 + D-47 (no npm, no Playwright). Pitfall 10 — dual triggers (push + pull_request).
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tests
        run: node --test tests/
